name: CI

# The site is published from the `gh-pages` branch by `npm run deploy`, so this
# workflow does not deploy — it gates the code. A build that doesn't lint or
# compile fails here rather than reaching a release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
